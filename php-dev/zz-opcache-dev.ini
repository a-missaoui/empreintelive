; Config opcache pour le DEV uniquement.
; Force PHP a re-verifier la date des fichiers a chaque requete : toute modif
; d'un .php est prise en compte immediatement, sans "docker compose restart".
; NE PAS utiliser en production (impact perf).
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
